  <path class="cls-10" d="M62.51,30.24h161.12c16.99,0,30.79,13.8,30.79,30.79v229.76c0,.53-.43.96-.96.96H81.34c-30.1,0-54.54-24.44-54.54-54.54V65.95c0-19.71,16-35.71,35.71-35.71Z"/>
  <text class="cls-4" transform="translate(57.11 116.44) scale(.92 1)"><tspan x="0" y="0">Animat</tspan><tspan class="cls-9" x="101.24" y="0">i</tspan><tspan x="110.39" y="0">on 2D</tspan></text>
  <text class="cls-2" transform="translate(44.92 147.42) scale(.92 1)"><tspan x="0" y="0">L&apos;animation 2D crée le mouvement en</tspan><tspan x="-7.99" y="14.77">dessinant chaque image individuellement</tspan><tspan x="-6.18" y="29.54">sur une surface bidimensionnelle, offrant</tspan><tspan x="27.66" y="44.31">un style artistique classique.</tspan></text>
  <path class="cls-10" d="M368.78,30.06h161.12c16.99,0,30.79,13.8,30.79,30.79v229.76c0,.53-.43.96-.96.96h-172.13c-30.1,0-54.54-24.44-54.54-54.54V65.77c0-19.71,16-35.71,35.71-35.71Z"/>
  <text class="cls-4" transform="translate(363.38 116.26) scale(.92 1)"><tspan x="0" y="0">Animat</tspan><tspan class="cls-9" x="101.24" y="0">i</tspan><tspan x="110.39" y="0">on 3D</tspan></text>
  <text class="cls-2" transform="translate(367.86 147.24) scale(.92 1)"><tspan x="0" y="0">L&apos;animation 3D utilise des images</tspan><tspan x="-24.49" y="14.77">tridimensionnelles générées par ordinateur</tspan><tspan x="-18.03" y="29.54">pour produire des mouvements réalistes</tspan><tspan x="-10.04" y="44.31">et des effets visuels impressionnants,</tspan><tspan x="-10.11" y="59.08">offrant une grande flexibilité créative.</tspan></text>
  <path class="cls-10" d="M673.64,29.88h161.12c16.99,0,30.79,13.8,30.79,30.79v229.76c0,.53-.43.96-.96.96h-172.13c-30.1,0-54.54-24.44-54.54-54.54V65.59c0-19.71,16-35.71,35.71-35.71Z"/>
  <text class="cls-4" transform="translate(678.54 116.64) scale(.92 1)"><tspan x="0" y="0">S</tspan><tspan class="cls-8" x="14.64" y="0">l</tspan><tspan class="cls-7" x="24.26" y="0">o</tspan><tspan class="cls-5" x="40.38" y="0">w </tspan><tspan class="cls-9" x="67.89" y="0">M</tspan><tspan class="cls-6" x="90.27" y="0">o</tspan><tspan class="cls-11" x="106.47" y="0">t</tspan><tspan class="cls-9" x="117.23" y="0">i</tspan><tspan x="126.39" y="0">on</tspan></text>
  <text class="cls-2" transform="translate(665.91 144.18) scale(.92 1)"><tspan x="0" y="0">Le slow motion, ou ralenti, ralentit la</tspan><tspan x="-5.39" y="14.77">vitesse d&apos;enregistrement de la caméra,</tspan><tspan x="-3.52" y="29.54">permettant une visualisation détaillée</tspan><tspan x="7.86" y="44.31">des mouvements et ajoutant une</tspan><tspan x="3.73" y="59.08">dimension artistique aux moments</tspan><tspan x="70.16" y="73.85">spéciaux.</tspan></text>
